name: Publish Blood Onyx V20 ru.18

on:
  push:
    branches: [main]
    paths:
      - "incoming/*ru.18*.zip"

permissions:
  contents: write

concurrency:
  group: blood-onyx-ru18-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact ru.18 changes, verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.2.0-ru.18"
          ASSET="blood-onyx-v20-ru18.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, refusing to replace it"
            exit 1
          fi
          ZIP="$(find incoming -maxdepth 1 -type f -name '*ru.18*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "No uploaded ru.18 ZIP found"
            exit 0
          fi
          export SOURCE_ZIP="$ZIP"
          export STAGING="$RUNNER_TEMP/blood-onyx-ru18"
          mkdir -p "$STAGING"
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          archive=pathlib.Path(os.environ["SOURCE_ZIP"])
          stage=pathlib.Path(os.environ["STAGING"])
          with zipfile.ZipFile(archive) as z:
              members=z.infolist()
              if not members or sum(m.file_size for m in members)>120_000_000:
                  raise SystemExit("Invalid or suspicious archive")
              for entry in members:
                  path=pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts or not path.parts or path.parts[0]!="vtm-v20":
                      raise SystemExit("Unexpected archive member: "+entry.filename)
                  if stat.S_ISLNK(entry.external_attr>>16):
                      raise SystemExit("Symlinks are forbidden")
              if z.testzip() is not None:
                  raise SystemExit("Broken ZIP")
              z.extractall(stage)
          root=stage/"vtm-v20"
          file=root/"system.json"
          m=json.loads(file.read_text(encoding="utf8"))
          if m.get("version")!="1.2.0-ru.18" or m.get("id")!="vtm-v20":
              raise SystemExit("Wrong system ID or version")
          m["url"]="https://github.com/Somnamibulism/Blood-Onyx-V20"
          m["manifest"]="https://raw.githubusercontent.com/Somnamibulism/Blood-Onyx-V20/main/system.json"
          m["download"]="https://github.com/Somnamibulism/Blood-Onyx-V20/releases/download/v1.2.0-ru.18/blood-onyx-v20-ru18.zip"
          file.write_text(json.dumps(m,ensure_ascii=False,indent=2)+"\\n",encoding="utf8")
          if not (root/"CHANGELOG-RU.18.md").exists():
              raise SystemExit("Missing change log")
          PY
          rsync -a --exclude='.github/' --exclude='incoming/' "$STAGING/vtm-v20/" ./
          mkdir -p packs/equipment packs/containers packs/v5lore
          node --test tests/*.test.mjs
          export RELEASE_ZIP="$RUNNER_TEMP/$ASSET"
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["STAGING"])/"vtm-v20"
          out=pathlib.Path(os.environ["RELEASE_ZIP"])
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.write(root,"vtm-v20/")
              for p in sorted(root.rglob("*")):
                  z.write(p,"vtm-v20/"+p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              if z.testzip() is not None: raise SystemExit("ZIP validation failed")
          PY
          git rm -- "$ZIP"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Blood Onyx V20 1.2.0-ru.18"
          git push origin HEAD:main
          gh release create "$TAG" "$RELEASE_ZIP" --repo "$GITHUB_REPOSITORY" --target main --title "Blood Onyx V20 ru.18" --notes-file CHANGELOG-RU.18.md
          echo "Published $TAG"
