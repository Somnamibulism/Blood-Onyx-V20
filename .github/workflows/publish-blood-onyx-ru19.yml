name: Publish Blood Onyx V20 ru.19

on:
  push:
    branches: [main]
    paths:
      - "incoming/*ru.19*.zip"

permissions:
  contents: write

concurrency:
  group: blood-onyx-ru19-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate source, run tests, publish installable ru.19
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.2.0-ru.19"
          ASSET="blood-onyx-v20-ru19.zip"
          ZIP="$(find incoming -maxdepth 1 -type f -name '*ru.19*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then echo "No incoming ru.19 ZIP"; exit 0; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"; exit 1
          fi
          export SOURCE_ZIP="$ZIP"
          export STAGING="$RUNNER_TEMP/ru19-stage"
          mkdir -p "$STAGING"
          python3 - <<'PY'
          import json,os,pathlib,stat,zipfile
          source=pathlib.Path(os.environ['SOURCE_ZIP'])
          stage=pathlib.Path(os.environ['STAGING'])
          with zipfile.ZipFile(source) as z:
              members=z.infolist()
              if not members or sum(x.file_size for x in members)>120_000_000:
                  raise SystemExit('Invalid ZIP size')
              names=set()
              for x in members:
                  name=pathlib.PurePosixPath(x.filename)
                  if name.is_absolute() or '..' in name.parts or not name.parts or name.parts[0]!='vtm-v20':
                      raise SystemExit('Unsafe ZIP path: '+x.filename)
                  if stat.S_ISLNK(x.external_attr >> 16):
                      raise SystemExit('Symlink forbidden')
                  if x.filename in names: raise SystemExit('Duplicate path')
                  names.add(x.filename)
              if z.testzip() is not None: raise SystemExit('Invalid ZIP CRC')
              z.extractall(stage)
          root=stage/'vtm-v20'
          m=json.loads((root/'system.json').read_text(encoding='utf8'))
          if m.get('version')!='1.2.0-ru.19' or m.get('id')!='vtm-v20':
              raise SystemExit('Incorrect manifest version/id')
          if not (root/'CHANGELOG-RU.19.md').is_file():
              raise SystemExit('Missing release changelog')
          PY
          rsync -a --exclude='.github/' --exclude='incoming/' "$STAGING/vtm-v20/" ./
          node --test tests/*.test.mjs
          python3 - <<'PY'
          import json,pathlib
          repo='https://github.com/Somnamibulism/Blood-Onyx-V20'
          for path in (pathlib.Path('system.json'),pathlib.Path('BUILD-INFO.json')):
              data=json.loads(path.read_text(encoding='utf8'))
              if path.name=='system.json':
                  data['url']=repo
                  data['manifest']='https://raw.githubusercontent.com/Somnamibulism/Blood-Onyx-V20/main/system.json'
                  data['download']=repo+'/releases/download/v1.2.0-ru.19/blood-onyx-v20-ru19.zip'
              else:
                  data['version']='1.2.0-ru.19'
                  data['build_version']='1.2.0-ru.19'
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          PY
          export ASSET_FILE="$RUNNER_TEMP/$ASSET"
          python3 - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ['STAGING'])/'vtm-v20'
          out=pathlib.Path(os.environ['ASSET_FILE'])
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              z.write(root,'vtm-v20/')
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name in ('system.json','BUILD-INFO.json') and p.parent==root:
                      z.write(pathlib.Path(p.name),'vtm-v20/'+p.name)
                  else:
                      z.write(p,'vtm-v20/'+p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z:
              if z.testzip() is not None: raise SystemExit('Release ZIP validation failed')
          print('Ready:',out.stat().st_size)
          PY
          git rm -- "$ZIP"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Blood Onyx V20 1.2.0-ru.19"
          git push origin HEAD:main
          gh release create "$TAG" "$ASSET_FILE" --repo "$GITHUB_REPOSITORY" --target main --title "Blood Onyx V20 ru.19" --notes-file CHANGELOG-RU.19.md
