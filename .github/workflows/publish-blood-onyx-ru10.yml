name: Publish Blood Onyx V20 ru.10

on:
  push:
    branches: [main]
    paths:
      - "incoming/blood-onyx-v20-ru10.zip"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ru.10 source and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="incoming/blood-onyx-v20-ru10.zip"
          VERSION="1.2.0-ru.10"
          TAG="v1.2.0-ru.10"
          RELEASE_ZIP="blood-onyx-v20-ru10.zip"

          # Deleting an uploaded ZIP in the release commit triggers another
          # matching push; that follow-up is intentionally a no-op.
          if [ ! -f "$ZIP" ]; then
            echo "No incoming ZIP to publish. Nothing to do."
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, refusing to overwrite."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/blood-onyx-ru10"
          export BLOOD_STAGING="$RUNNER_TEMP/blood-onyx-ru10"
          export BLOOD_ZIP="$ZIP"
          python3 - <<'PY'
          import json, os, pathlib, stat, zipfile
          source=pathlib.Path(os.environ["BLOOD_ZIP"])
          destination=pathlib.Path(os.environ["BLOOD_STAGING"])
          with zipfile.ZipFile(source) as z:
              for info in z.infolist():
                  name=pathlib.PurePosixPath(info.filename)
                  if name.is_absolute() or ".." in name.parts or name.parts[0] != "vtm-v20":
                      raise SystemExit(f"Unexpected archive entry: {info.filename}")
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symlink not allowed: {info.filename}")
              z.extractall(destination)
          root=destination / "vtm-v20"
          file=root / "system.json"
          manifest=json.loads(file.read_text(encoding="utf-8"))
          if manifest.get("id")!="vtm-v20" or manifest.get("version")!="1.2.0-ru.10":
              raise SystemExit("Incorrect system id or version")
          base="https://github.com/Somnamibulism/Blood-Onyx-V20"
          manifest["url"]=base
          manifest["manifest"]="https://raw.githubusercontent.com/Somnamibulism/Blood-Onyx-V20/main/system.json"
          manifest["download"]=base+"/releases/download/v1.2.0-ru.10/blood-onyx-v20-ru10.zip"
          file.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          build=root/"BUILD-INFO.json"
          if build.is_file():
              data=json.loads(build.read_text(encoding="utf-8"))
              data["build_version"]="1.2.0-ru.10"
              build.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if not (root/"CHANGELOG-RU.10.md").is_file():
              raise SystemExit("Missing ru.10 changelog")
          PY

          rsync -a --exclude='.github/' --exclude='incoming/' "$BLOOD_STAGING/vtm-v20/" ./
          git rm -- "$ZIP"
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release Blood Onyx V20 $VERSION"
          git push origin HEAD:main

          (cd "$BLOOD_STAGING" && zip -qr "$RUNNER_TEMP/$RELEASE_ZIP" vtm-v20)
          gh release create "$TAG" "$RUNNER_TEMP/$RELEASE_ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Blood Onyx V20 ru.10" \
            --notes-file "$BLOOD_STAGING/vtm-v20/CHANGELOG-RU.10.md"
          echo "Published $TAG"
